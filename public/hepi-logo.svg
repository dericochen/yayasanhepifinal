<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for gradients and text path -->
  <defs>
    <!-- Outer Text Path along bottom arc -->
    <path id="textArc" d="M 75,250 A 175,175 0 0,0 425,250" fill="none"/>
    
    <!-- Globe Gradient -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2270B8" />
      <stop offset="100%" stop-color="#1B5592" />
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#559942" />
      <stop offset="100%" stop-color="#3A752A" />
    </linearGradient>
  </defs>

  <!-- Background Circle Outline -->
  <circle cx="250" cy="250" r="230" fill="#FFFFFF" stroke="#3A752A" stroke-width="4" />

  <!-- Blue Earth Sphere -->
  <circle cx="250" cy="235" r="165" fill="url(#globeGrad)" />

  <!-- Indonesia Islands Silhouette (Simplified Green Map) -->
  <g fill="#559942" opacity="0.95">
    <!-- Sumatra -->
    <path d="M 120,270 Q 140,240 180,210 Q 200,225 170,265 Q 140,285 120,270 Z" />
    <!-- Java -->
    <path d="M 185,285 Q 215,290 245,285 Q 240,295 190,293 Z" />
    <!-- Kalimantan (Borneo) -->
    <path d="M 215,220 Q 240,210 255,235 Q 240,260 215,250 Z" />
    <!-- Sulawesi -->
    <path d="M 270,225 Q 285,215 295,235 Q 280,240 285,260 Q 275,250 270,225 Z" />
    <!-- Papua -->
    <path d="M 320,240 Q 360,230 380,250 Q 350,265 320,255 Z" />
  </g>

  <!-- Upper Leaf (Swooping from top-left over top-right) -->
  <path d="M 100,220 C 80,100 240,30 380,80 C 440,140 380,230 290,250 C 180,260 120,240 100,220 Z" fill="url(#leafGrad)" />
  <!-- Leaf Vein Upper -->
  <path d="M 130,190 Q 250,110 370,90" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M 200,150 Q 220,130 240,140" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
  <path d="M 270,120 Q 290,100 310,110" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />

  <!-- Lower Leaf (Swooping from bottom-right under bottom-left) -->
  <path d="M 400,250 C 420,370 260,440 120,390 C 60,330 120,240 210,220 C 320,210 380,230 400,250 Z" fill="url(#leafGrad)" />
  <!-- Leaf Vein Lower -->
  <path d="M 370,280 Q 250,360 130,380" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M 300,320 Q 280,340 260,330" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
  <path d="M 230,350 Q 210,370 190,360" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />

  <!-- Center HePI Brand Text -->
  <text x="250" y="248" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">HePI</text>

  <!-- Curved Bottom Text: HEALTHY PLANET INDONESIA -->
  <text font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#111111" letter-spacing="4">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      HEALTHY PLANET INDONESIA
    </textPath>
  </text>
</svg>
